name: Release

# Publishes to npm and creates a GitHub release. Two ways to start it:
#
# 1. Push a version tag: `git tag v0.1.0 && git push origin v0.1.0`.
# 2. Run it manually from the Actions tab ("Run workflow") with the version
#    to release, e.g. `0.1.0`. The workflow then creates the tag itself, so
#    no local git access is needed.
#
# Requirements:
# - An `NPM_TOKEN` repository secret holding an npm granular access token
#   with publish permission for this package.
# - The version must match the one in package.json on the released commit.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (must match package.json)'
        required: true
        type: string

permissions:
  contents: write # push the tag and create the GitHub release
  id-token: write # npm provenance attestation

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Resolve the version and verify it matches package.json
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          PKG="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG" ]; then
            echo "Requested version $VERSION does not match package.json version $PKG" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create the tag (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, reusing it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: Show what will be published
        run: npm publish --dry-run

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
            const start = changelog.indexOf(`## [${version}]`);
            if (start < 0) { console.error(`No CHANGELOG section for ${version}`); process.exit(1); }
            const rest = changelog.slice(start);
            const next = rest.indexOf("\n## [", 1);
            const section = (next < 0 ? rest : rest.slice(0, next)).trim();
            fs.writeFileSync("release-notes.md", section + "\n");
          ' "$VERSION"
          cat release-notes.md

      - name: Create the GitHub release (skipped if it already exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, leaving it as is."
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
          fi
