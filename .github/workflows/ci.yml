name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Verify the built package from ESM and CommonJS
        run: |
          node -e "import('./dist/index.js').then(m => { if (typeof m.sanitize !== 'function') process.exit(1) })"
          node -e "const m = require('./dist/index.cjs'); if (typeof m.sanitize !== 'function') process.exit(1)"
